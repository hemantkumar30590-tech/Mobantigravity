name: Build MobAntigravity APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Shell and Python scripts
        run: |
          bash -n app/src/main/assets/setup.sh
          bash -n app/src/main/assets/sync-scripts.sh
          bash -n app/src/main/assets/scripts/gem
          python3 -m py_compile app/src/main/assets/scripts/patch_va39.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=MobAntigravity,O=MobAntigravity,C=IN"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Copy APK with clean filename
        run: cp app/build/outputs/apk/debug/app-debug.apk MobAntigravity-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobAntigravity-debug-apk
          path: MobAntigravity-debug.apk
          retention-days: 30

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: MobAntigravity (Latest APK)
          body: |
            One-tap Kotlin launcher for Antigravity 2.0 on Android (v1.4.0 – Oppo A79 5G & Mali tuned).

            - Dynamic WindowInsets display resolution & DPI auto-detection
            - MediaTek Mali-G57 thermal/thread limiting (LP_NUM_THREADS=4) & RAM cap (NODE_OPTIONS + MALLOC_ARENA_MAX=2)
            - Foreground keep-alive service + ColorOS Battery & Restricted Settings shortcuts
            - Fast 2-second script sync without reinstalling Debian PRoot
            - Atomic VA39 binary patcher with verification
            - Built by GitHub Actions from this repository
          files: MobAntigravity-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
